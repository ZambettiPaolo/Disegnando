baseURL = "https://examplesite.com/"
title = "Disegnando"
paginate = 5
theme = "PaperMod"
languageCode = "it-it"
defaultContentLanguage = "it"
DateFormat = "02/01/2006"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
disableXML = true
minifyOutput = true


[params]
env = "production"
title = "Disegnando"
description = "Blog di Paolo Zambetti"
keywords = ["Blog", "Portfolio", "PaperMod"]
author = "Paolo Zambetti"
# author = ["Me", "You"]
images = ["<link or path of image for opengraph, twitter-cards>"]
DateFormat = "02/01/2006"

defaultTheme = "light"
disableThemeToggle = false

ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = false
ShowCodeCopyButtons = false
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = false
hidemeta = false
hideSummary = false
showtoc = true
tocopen = false


[params.assets]
favicon = "<link / abs url>"
favicon16x16 = "<link / abs url>"
favicon32x32 = "<link / abs url>"
apple_touch_icon = "<link / abs url>"
safari_pinned_tab = "<link / abs url>"


[params.label]
text = "Home"
icon = "/apple-touch-icon.png"
iconHeight = 35


[params.profileMode]
enabled = true
title = "Disegnando"
subtitle = "Blog di Paolo Zambetti"
imageUrl = "/images/foto_tessera.png"
imageWidth = 332
imageHeight = 394
imageTitle = "my image"


[[params.profileMode.buttons]]
name = "Posts"
url = "posts"


[[params.profileMode.buttons]]
name = "Tags"
url = "tags"



#[params.homeInfoParams]
#Title = "Hi there 👋"
#Content = "Welcome to my blog"



[[params.socialIcons]]
name = "x"
url = "https://x.com/"


[[params.socialIcons]]
name = "stackoverflow"
url = "https://stackoverflow.com"


[[params.socialIcons]]
name = "github"
url = "https://github.com/"



[params.analytics.google]
SiteVerificationTag = "XYZabc"

[params.analytics.bing]
SiteVerificationTag = "XYZabc"

[params.analytics.yandex]
SiteVerificationTag = "XYZabc"



[params.cover]
hidden = true
hiddenInList = true
hiddenInSingle = true



[params.editPost]
URL = "https://github.com/<path_to_repo>/content"
Text = "Suggest Changes"
appendFilePath = true



[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 1000
threshold = 0.4
minMatchCharLength = 0
limit = 10
keys = ["title", "permalink", "summary", "content"]



[[menu.main]]
identifier = "categories"
name = "categories"
url = "/categories/"
weight = 10


[[menu.main]]
identifier = "tags"
name = "tags"
url = "/tags/"
weight = 20


[[menu.main]]
identifier = "example"
name = "example.org"
url = "https://example.org"
weight = 30



pygmentsUseClasses = true


[markup.highlight]
noClasses = false
